[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riparlare-discord-migration"
version = "0.1.0"
description = "Device-side, resumable Discord history export for Riparlare migration"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
riparlare-discord-export = "discord_export:cli"

[tool.setuptools]
py-modules = ["discord_export"]
